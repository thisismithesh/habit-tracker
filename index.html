<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routine Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f6bed">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#7a8190;--line:#e8eaee;--accent:#4f6bed;--accent-soft:#e9edfd;--done:#1f9d63;--done-soft:#e3f5ec;--not:#d9443f;--not-soft:#fbe7e6;--oth:#c98a0b;--oth-soft:#fbf1da;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#8b93a3;--line:#262a32;--accent:#7b91ff;--accent-soft:#222a4d;--done:#3ec98a;--done-soft:#173326;--not:#f0716c;--not-soft:#3a1d1c;--oth:#e5a935;--oth-soft:#3a2f14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#8b93a3;--line:#262a32;--accent:#7b91ff;--accent-soft:#222a4d;--done:#3ec98a;--done-soft:#173326;--not:#f0716c;--not-soft:#3a1d1c;--oth:#e5a935;--oth-soft:#3a2f14;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hi{font-size:22px;font-weight:700;letter-spacing:-.3px}
.link{color:var(--muted);font-size:13px;padding:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{padding:10px;border-radius:11px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg small{font-weight:500;opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav button.arrow{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.datenav .d{font-weight:700;font-size:17px;text-align:center}
.datenav .d small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.g i{background:var(--done)}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.sum b{color:var(--text)}
.t-name{font-weight:650;font-size:17px}
.t-sub{color:var(--muted);font-size:13px;margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.opts button{padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.opts button.done.on{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.opts button.not.on{background:var(--not-soft);border-color:var(--not);color:var(--not)}
.opts button.oth.on{background:var(--oth-soft);border-color:var(--oth);color:var(--oth)}
.pill{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600}
.pill.done{background:var(--done-soft);color:var(--done)}.pill.not{background:var(--not-soft);color:var(--not)}.pill.oth{background:var(--oth-soft);color:var(--oth)}.pill.none{background:var(--line);color:var(--muted)}
.note{margin-top:10px;padding:10px 12px;background:var(--oth-soft);border-radius:12px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{color:var(--muted);font-size:18px;padding:2px 8px;border-radius:8px}
.dots{display:flex;gap:5px;margin-top:10px}
.dots span{width:14px;height:14px;border-radius:5px;background:var(--line)}
.dots .done{background:var(--done)}.dots .not{background:var(--not)}.dots .oth{background:var(--oth)}.dots .miss{background:var(--line);outline:1.5px dashed var(--muted);outline-offset:-3px;background:none}
.primary{width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:650}
.add{width:100%;padding:14px;border-radius:14px;border:1.5px dashed var(--line);color:var(--accent);font-weight:650;margin-bottom:12px}
.g-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:10px 0 6px}
.g-meta .late{color:var(--not);font-weight:600}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;padding:10px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px}
details{margin-top:10px;font-size:14px}summary{color:var(--muted);cursor:pointer}
.wn{padding:8px 0;border-top:1px solid var(--line)}.wn small{color:var(--muted);display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{padding:12px 0 10px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400}
nav button.on{color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:19px}
label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px}
input[type=text],input[type=date],textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);min-width:42px}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sheet .btns{margin-top:18px}.sheet .btns .ghost{background:var(--line);color:var(--text)}.sheet .btns .go{background:var(--accent);color:#fff;flex:2}
.pick{display:flex;flex-direction:column;gap:12px;min-height:80vh;justify-content:center;text-align:center}
.pick h1{margin:0 0 6px;font-size:28px;letter-spacing:-.5px}.pick p{color:var(--muted);margin:0 0 18px}
.pick button{padding:22px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);font-size:20px;font-weight:700}
.pick button:active{border-color:var(--accent)}
.banner{background:var(--oth-soft);color:var(--oth);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden><div>
<button data-tab="today"><b>✓</b>Today</button>
<button data-tab="routines"><b>↻</b>Routines</button>
<button data-tab="goals"><b>◎</b>Goals</button>
</div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
const PEOPLE=['Mithesh','Avinash'];
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let me=null,view=null,tab='today',writing=0,chain=Promise.resolve();
try{me=localStorage.getItem('me')}catch(e){}
if(!PEOPLE.map(p=>p.toLowerCase()).includes(me))me=null;
view=me;
const blank=()=>({tasks:[],logs:{},goals:[]});
const data={mithesh:blank(),avinash:blank()};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s[0].toUpperCase()+s.slice(1);
const todayS=ymd(new Date());
let date=todayS;
const fmt=(s,o)=>parse(s).toLocaleDateString('en-IN',o||{weekday:'short',day:'numeric',month:'short'});
const mine=()=>view===me;
function weekStart(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)}
function due(t,ds){if(ds<t.created)return false;const d=parse(ds);if(t.freq==='daily')return true;if(t.freq==='week')return(t.days||[]).includes(d.getDay());return(t.days||[]).includes(d.getDate())}
function sched(t){if(t.freq==='daily')return'Every day';if(t.freq==='week')return'Every '+(t.days||[]).slice().sort((a,b)=>a-b).map(i=>DN[i]).join(', ');return'Monthly on '+(t.days||[]).slice().sort((a,b)=>a-b).map(n=>n+ord(n)).join(', ')}
function ord(n){return n%10==1&&n!=11?'st':n%10==2&&n!=12?'nd':n%10==3&&n!=13?'rd':'th'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
const SUPABASE_URL='https://dztbunhndicomfwgojhp.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6dGJ1bmhuZGljb21md2dvamhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxOTEyOTAsImV4cCI6MjEwODc2NzI5MH0.gQks2XCx-vPdInqVodx4i5BK3NzhSLvkrXCeXYMTsa0';
const CONFIGURED=!SUPABASE_URL.startsWith('PASTE')&&!SUPABASE_KEY.startsWith('PASTE');
let ready=!CONFIGURED,syncErr=false,lastWrite=0;
const H={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
function cacheSave(){try{localStorage.setItem('data',JSON.stringify(data))}catch(e){}}
function cacheLoad(){try{const c=JSON.parse(localStorage.getItem('data')||'null');if(c)['mithesh','avinash'].forEach(id=>{const v=c[id]||{};data[id]={tasks:v.tasks||[],logs:v.logs||{},goals:v.goals||[]}})}catch(e){}}
function save(){
  cacheSave();
  if(!CONFIGURED)return;
  if(!ready){toast('Still connecting… try again in a moment');return}
  writing++;lastWrite=Date.now();
  const body=JSON.stringify({id:me,data:JSON.parse(JSON.stringify(data[me]))});
  chain=chain.then(()=>fetch(SUPABASE_URL+'/rest/v1/trackers',{method:'POST',headers:Object.assign({},H,{Prefer:'resolution=merge-duplicates,return=minimal'}),body}).then(r=>{if(!r.ok)throw new Error(r.status);syncErr=false})).catch(()=>{syncErr=true;toast('Couldn’t save. Check your connection.')}).finally(()=>{writing--;lastWrite=Date.now()});
}
async function pull(){
  if(!CONFIGURED)return;
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/trackers?select=id,data',{headers:H});
    if(!r.ok)throw new Error(r.status);
    const rows=await r.json();syncErr=false;
    rows.forEach(row=>{
      const id=row.id;if(!data[id])return;
      if(id===me&&(writing>0||Date.now()-lastWrite<6000))return;
      const v=row.data||{};data[id]={tasks:v.tasks||[],logs:v.logs||{},goals:v.goals||[]};
    });
    ready=true;cacheSave();
  }catch(e){syncErr=true}
  if(!$('#ov').classList.contains('show'))render();
}
function status(id,t,ds){return((data[id].logs[ds]||{})[t.id])||null}

function render(){
  const app=$('#app');
  if(!me){$('#nav').hidden=true;app.innerHTML='<div class="pick"><div><h1>Welcome 👋</h1><p>Who’s using this phone?</p></div>'+PEOPLE.map(p=>'<button data-pick="'+p+'">'+p+'</button>').join('')+'</div>';return}
  $('#nav').hidden=false;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const other=PEOPLE.find(p=>p.toLowerCase()!==me);
  let h='<div class="top"><div class="hi">'+(mine()?'Hi, '+cap(me):cap(view)+'’s tracker')+'</div><button class="link" data-a="switchme">Not '+cap(me)+'?</button></div>';
  h+='<div class="seg">'+[me,other.toLowerCase()].map(p=>'<button data-view="'+p+'" class="'+(view===p?'on':'')+'">'+cap(p)+(p===me?' <small>(you)</small>':'')+'</button>').join('')+'</div>';
  if(!CONFIGURED)h+='<div class="banner">Not connected to Supabase yet, so data stays on this device only.</div>';
  else if(syncErr)h+='<div class="banner">Can’t reach the server right now. Showing the last saved data.</div>';
  h+=tab==='today'?vToday():tab==='routines'?vRoutines():vGoals();
  app.innerHTML=h;
}
function vToday(){
  const d=data[view],list=d.tasks.filter(t=>due(t,date));
  const done=list.filter(t=>(status(view,t,date)||{}).s==='done').length;
  const isT=date===todayS;
  let h='<div class="datenav"><button class="arrow" data-a="day" data-n="-1">‹</button><div class="d" data-a="today">'+fmt(date)+'<small>'+(isT?'Today':'Tap to jump to today')+'</small></div><button class="arrow" data-a="day" data-n="1">›</button></div>';
  if(list.length)h+='<div class="card"><div class="sum"><span><b>'+done+'</b> of '+list.length+' done</span><span>'+Math.round(done/list.length*100)+'%</span></div><div class="bar g"><i style="width:'+done/list.length*100+'%"></i></div></div>';
  if(!list.length)return h+'<div class="empty">Nothing scheduled for this day.'+(mine()?'<br>Add routines in the Routines tab.':'')+'</div>';
  list.forEach(t=>{
    const s=status(view,t,date),k=s?s.s:'';
    h+='<div class="card"><div class="t-name">'+esc(t.name)+'</div><div class="t-sub">'+sched(t)+'</div>';
    if(mine())h+='<div class="opts" data-t="'+t.id+'"><button class="done '+(k==='done'?'on':'')+'" data-s="done">✓ Done</button><button class="not '+(k==='not'?'on':'')+'" data-s="not">✕ Not done</button><button class="oth '+(k==='oth'?'on':'')+'" data-s="oth">… Other</button></div>';
    else h+='<span class="pill '+(k||'none')+'">'+({done:'✓ Done',not:'✕ Not done',oth:'… Other'}[k]||'Not marked yet')+'</span>';
    if(k==='oth'&&s.n)h+='<div class="note">'+esc(s.n)+'</div>';
    h+='</div>';
  });
  return h;
}
function vRoutines(){
  const d=data[view];let h='';
  if(mine())h+='<button class="add" data-a="addtask">+ New routine</button>';
  if(!d.tasks.length)return h+'<div class="empty">No routines yet.</div>';
  const days=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);days.push(ymd(x))}
  d.tasks.forEach(t=>{
    h+='<div class="card"><div class="row"><div><div class="t-name">'+esc(t.name)+'</div><div class="t-sub">'+sched(t)+'</div></div>'+(mine()?'<button class="x" data-a="deltask" data-id="'+t.id+'">✕</button>':'')+'</div><div class="dots">'+days.map(ds=>{
      if(!due(t,ds))return'<span title="'+ds+'" style="opacity:.25"></span>';
      const s=status(view,t,ds);return'<span title="'+ds+'" class="'+(s?s.s:ds===todayS?'':'miss')+'"></span>'}).join('')+'</div><div class="t-sub" style="margin-top:6px">Last 7 days</div></div>';
  });
  return h;
}
function vGoals(){
  const gs=data[view].goals;let h='';
  if(mine())h+='<button class="add" data-a="addgoal">+ New goal</button>';
  if(!gs.length)return h+'<div class="empty">No goals yet.</div>';
  gs.forEach(g=>{
    const left=Math.ceil((parse(g.deadline)-parse(todayS))/864e5),p=g.progress||0;
    const lbl=p>=100?'Completed 🎉':left<0?'<span class="late">Overdue by '+(-left)+' day'+(left==-1?'':'s')+'</span>':left===0?'Due today':left+' day'+(left==1?'':'s')+' left';
    const notes=(g.notes||[]).slice().sort((a,b)=>b.wk<a.wk?-1:1);
    h+='<div class="card"><div class="row"><div class="t-name">'+esc(g.title)+'</div>'+(mine()?'<button class="x" data-a="delgoal" data-id="'+g.id+'">✕</button>':'')+'</div><div class="g-meta"><span>By '+fmt(g.deadline,{day:'numeric',month:'short',year:'numeric'})+' · '+lbl+'</span><b style="color:var(--text)">'+p+'%</b></div><div class="bar '+(p>=100?'g':'')+'"><i style="width:'+p+'%"></i></div>';
    if(notes.length)h+='<div class="note" style="background:var(--accent-soft)"><small style="color:var(--muted)">Latest · week of '+fmt(notes[0].wk,{day:'numeric',month:'short'})+'</small><br>'+esc(notes[0].text)+'</div>';
    if(notes.length>1)h+='<details><summary>Earlier notes ('+(notes.length-1)+')</summary>'+notes.slice(1).map(n=>'<div class="wn"><small>Week of '+fmt(n.wk,{day:'numeric',month:'short'})+'</small>'+esc(n.text)+'</div>').join('')+'</details>';
    if(mine())h+='<div class="btns"><button data-a="updgoal" data-id="'+g.id+'">Update progress &amp; weekly note</button></div>';
    h+='</div>';
  });
  return h;
}

/* sheets */
function openSheet(title,body,onOpen,onSave,saveLabel){
  $('#sheet').innerHTML='<h3>'+title+'</h3>'+body+'<div class="btns"><button class="ghost" id="sCancel">Cancel</button><button class="go" id="sSave">'+(saveLabel||'Save')+'</button></div>';
  $('#ov').classList.add('show');
  $('#sCancel').onclick=closeSheet;
  $('#sSave').onclick=()=>{if(onSave()!==false)closeSheet()};
  if(onOpen)onOpen();
}
function closeSheet(){$('#ov').classList.remove('show')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});

function addTask(){
  let freq='daily',sel=new Set();
  openSheet('New routine','<label>Name</label><input type="text" id="f-name" placeholder="e.g. Morning run" maxlength="60"><label>Repeats</label><div class="chips" id="f-freq"><button data-v="daily" class="on">Every day</button><button data-v="week">Days of week</button><button data-v="month">Days of month</button></div><div id="f-days"></div>',()=>{
    const draw=()=>{
      const box=$('#f-days');
      if(freq==='daily'){box.innerHTML='';return}
      const items=freq==='week'?[1,2,3,4,5,6,0].map(i=>[i,DN[i]]):Array.from({length:31},(_,i)=>[i+1,String(i+1)]);
      box.innerHTML='<label>'+(freq==='week'?'Which days?':'Which dates?')+'</label><div class="chips">'+items.map(a=>'<button data-d="'+a[0]+'" class="'+(sel.has(a[0])?'on':'')+'">'+a[1]+'</button>').join('')+'</div>';
    };
    $('#f-freq').onclick=e=>{const b=e.target.closest('button');if(!b)return;freq=b.dataset.v;sel=new Set();document.querySelectorAll('#f-freq button').forEach(x=>x.classList.toggle('on',x===b));draw()};
    $('#f-days').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=+b.dataset.d;sel.has(n)?sel.delete(n):sel.add(n);b.classList.toggle('on')};
  },()=>{
    const name=$('#f-name').value.trim();
    if(!name){toast('Give it a name');return false}
    if(freq!=='daily'&&!sel.size){toast('Pick at least one day');return false}
    data[me].tasks.push({id:uid(),name,freq,days:[...sel],created:todayS});save();render();
  },'Add routine');
}
function otherNote(tid){
  const cur=status(me,{id:tid},date);
  openSheet('What happened?','<label>Add a note (required)</label><textarea id="f-note" placeholder="e.g. Skipped because I was travelling">'+esc(cur&&cur.n||'')+'</textarea>',()=>setTimeout(()=>$('#f-note').focus(),50),()=>{
    const n=$('#f-note').value.trim();
    if(!n){toast('A note is needed for “Other”');return false}
    setStatus(tid,'oth',n);
  });
}
function setStatus(tid,s,n){
  const L=data[me].logs;L[date]=L[date]||{};
  if(s===null)delete L[date][tid];else L[date][tid]=n?{s,n}:{s};
  save();render();
}
function addGoal(){
  openSheet('New goal','<label>Goal</label><input type="text" id="f-title" placeholder="e.g. Finish portfolio website" maxlength="80"><label>Deadline</label><input type="date" id="f-dl" min="'+todayS+'">',null,()=>{
    const title=$('#f-title').value.trim(),dl=$('#f-dl').value;
    if(!title||!dl){toast('Add a title and a deadline');return false}
    data[me].goals.push({id:uid(),title,deadline:dl,progress:0,notes:[],created:todayS});save();render();
  },'Add goal');
}
function updGoal(id){
  const g=data[me].goals.find(x=>x.id===id),wk=weekStart(new Date()),cur=(g.notes||[]).find(n=>n.wk===wk);
  openSheet(esc(g.title),'<label>Progress: <b id="pv">'+(g.progress||0)+'%</b></label><input type="range" id="f-p" min="0" max="100" step="5" value="'+(g.progress||0)+'"><label>Note for this week (week of '+fmt(wk,{day:'numeric',month:'short'})+')</label><textarea id="f-wn" placeholder="How did it go this week?">'+esc(cur?cur.text:'')+'</textarea>',()=>{$('#f-p').oninput=e=>{$('#pv').textContent=e.target.value+'%'}},()=>{
    g.progress=+$('#f-p').value;const t=$('#f-wn').value.trim();g.notes=(g.notes||[]).filter(n=>n.wk!==wk);
    if(t)g.notes.push({wk,text:t});save();render();
  });
}
function confirmDel(msg,fn){openSheet('Delete?','<p style="margin:0;color:var(--muted)">'+msg+'</p>',null,()=>{fn()},'Delete')}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-a]');if(!t)return;
  if(t.dataset.pick){me=view=t.dataset.pick.toLowerCase();try{localStorage.setItem('me',me)}catch(x){}render();return}
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.view){view=t.dataset.view;render();return}
  const a=t.dataset.a;if(!a)return;
  if(a==='switchme'){me=view=null;try{localStorage.removeItem('me')}catch(x){}render()}
  else if(a==='day'){const d=parse(date);d.setDate(d.getDate()+ +t.dataset.n);date=ymd(d);render()}
  else if(a==='today'){date=todayS;render()}
  else if(!mine())return;
  else if(a==='addtask')addTask();
  else if(a==='addgoal')addGoal();
  else if(a==='updgoal')updGoal(t.dataset.id);
  else if(a==='deltask')confirmDel('This removes the routine and its history from your tracker.',()=>{const i=t.dataset.id;data[me].tasks=data[me].tasks.filter(x=>x.id!==i);Object.values(data[me].logs).forEach(l=>delete l[i]);save();render()});
  else if(a==='delgoal')confirmDel('This removes the goal and all its notes.',()=>{data[me].goals=data[me].goals.filter(x=>x.id!==t.dataset.id);save();render()});
});
document.addEventListener('click',e=>{
  const b=e.target.closest('.opts button');if(!b||!mine())return;
  const tid=b.parentElement.dataset.t,s=b.dataset.s,cur=status(me,{id:tid},date);
  if(cur&&cur.s===s)setStatus(tid,null);
  else if(s==='oth')otherNote(tid);
  else setStatus(tid,s);
});

cacheLoad();
render();
pull();
setInterval(pull,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script>
</body>
</html>
